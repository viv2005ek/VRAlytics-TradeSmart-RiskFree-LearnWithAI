
name: Supabase Keep Alive

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Keep Supabase Active
        run: |

          echo "Starting Supabase keep alive..."

          ACCESS_TOKEN=$(curl -s \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/auth/v1/token?grant_type=password" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "email":"${{ secrets.DEMO_EMAIL }}",
              "password":"${{ secrets.DEMO_PASSWORD }}"
            }' | jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Authentication failed"
            exit 1
          fi

          echo "Authenticated successfully"

          # profiles
          curl -s \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer $ACCESS_TOKEN"

          # user_portfolios
          curl -s \
            "${{ secrets.SUPABASE_URL }}/rest/v1/user_portfolios?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer $ACCESS_TOKEN"

          # user_stocks
          curl -s \
            "${{ secrets.SUPABASE_URL }}/rest/v1/user_stocks?select=*&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer $ACCESS_TOKEN"

          # transactions
          curl -s \
            "${{ secrets.SUPABASE_URL }}/rest/v1/transactions?select=*&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer $ACCESS_TOKEN"

          # watchlist
          curl -s \
            "${{ secrets.SUPABASE_URL }}/rest/v1/watchlist?select=*&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer $ACCESS_TOKEN"

          # net_worth_history
          curl -s \
            "${{ secrets.SUPABASE_URL }}/rest/v1/net_worth_history?select=*&limit=5" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer $ACCESS_TOKEN"

          echo "Supabase keep alive completed."
